<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>İlanı Düzenle</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:20px;}.box{background:#1e293b;padding:25px;border-radius:8px;max-width:800px;margin:auto;border:1px solid #334155;}h3{margin-top:0;color:#38bdf8;}input,textarea,select{width:100%;padding:10px;margin:6px 0 15px 0;background:#0f172a;border:1px solid #334155;color:white;border-radius:4px;box-sizing:border-box;}button{background:#28a745;color:white;padding:12px 20px;border:none;font-weight:bold;border-radius:4px;cursor:pointer;}</style></head><body><div class="box"><h3>✏️ İlanı Düzenle: {{ ilan.isim }}</h3><form method="POST"><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;"><div><label>Model İsmi:</label><input type="text" name="name" value="{{ ilan.isim }}" required></div><div><label>1. Telefon / WhatsApp:</label><input type="text" name="tel" value="{{ ilan.tel }}" required></div><div><label>2. Telefon (Opsiyonel):</label><input type="text" name="tel2" value="{{ ilan.tel2 }}"></div><div><label>Yaş:</label><input type="text" name="yas" value="{{ ilan.yas }}" required></div><div><label>Boy / Kilo:</label><input type="text" name="boy" value="{{ ilan.boy }}" required style="margin-bottom:5px;"><input type="text" name="kilo" value="{{ ilan.kilo }}" required></div><div><label>Şehir (İl):</label><input type="text" name="il" value="{{ ilan.il }}" required></div><div><label>Semt / İlçe:</label><input type="text" name="semt" value="{{ ilan.semt }}" required></div><div><label>Görüşme Yeri:</label><input type="text" name="gorusme" value="{{ ilan.gorusme }}" required></div></div><div style="background:#0f172a;padding:12px;border-radius:4px;border:1px solid #334155;margin-bottom:15px;"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold;color:#38bdf8;"><input type="checkbox" name="sabit" value="1" {% if ilan.sabit %}checked{% endif %} style="width:20px;height:20px;"> 📌 Bu İlanı Vitrinde Başa Sabitle (Max 10 İlan)</label><label style="margin-top:10px;display:block;">Sabitleme Süresi (1 - 4 Hafta):</label><select name="sabit_hafta" style="margin-top:3px;"><option value="1" {% if ilan.sabit_hafta == 1 %}selected{% endif %}>1 Hafta</option><option value="2" {% if ilan.sabit_hafta == 2 %}selected{% endif %}>2 Hafta</option><option value="3" {% if ilan.sabit_hafta == 3 %}selected{% endif %}>3 Hafta</option><option value="4" {% if ilan.sabit_hafta == 4 %}selected{% endif %}>4 Hafta</option></select></div><label>İlan Açıklaması:</label><textarea name="aciklama" rows="4" required>{{ ilan.aciklama }}</textarea><button type="submit">Değişiklikleri Kaydet</button></form><br><a href="/admin" style="color:#94a3b8;text-decoration:none;">← Yönetim Paneline Geri Dön</a></div></body></html>
